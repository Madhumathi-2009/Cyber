<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Duo — Security Learning</title>

<style>
/* =========================================================
   CYBER DUO
   Complete single-file application
   ========================================================= */

:root {
    --bg: #090909;
    --bg-soft: #0f0f0f;
    --card: #121212;
    --card-2: #181818;
    --card-3: #202020;

    --text: #f5f5f5;
    --text-soft: #d1d1d1;
    --muted: #999999;
    --muted-2: #737373;

    --border: #2a2a2a;

    --red: #e21d43;
    --red-hover: #f52b50;
    --red-soft: rgba(226,29,67,.12);

    --green: #27b879;
    --green-soft: rgba(39,184,121,.12);

    --yellow: #e6ad32;
    --yellow-soft: rgba(230,173,50,.12);

    --shadow: 0 18px 45px rgba(0,0,0,.28);
}

[data-theme="light"] {
    --bg: #f4f4f5;
    --bg-soft: #eeeeef;

    --card: #ffffff;
    --card-2: #fafafa;
    --card-3: #eeeeef;

    --text: #151515;
    --text-soft: #333333;
    --muted: #626262;
    --muted-2: #777777;

    --border: #d9d9dc;

    --red: #c91538;
    --red-hover: #ad0f2d;
    --red-soft: rgba(201,21,56,.08);

    --green: #118354;
    --green-soft: rgba(17,131,84,.09);

    --yellow: #986900;
    --yellow-soft: rgba(152,105,0,.09);

    --shadow: 0 12px 32px rgba(0,0,0,.08);
}

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
}

a {
    color: inherit;
    text-decoration: none;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 255px;

    background: var(--card);
    border-right: 1px solid var(--border);

    padding: 22px 15px;

    display: flex;
    flex-direction: column;

    z-index: 100;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;

    padding: 3px 8px 25px;
}

.logo {
    width: 43px;
    height: 43px;

    border-radius: 12px;

    background: var(--red);

    display: grid;
    place-items: center;

    box-shadow: 0 9px 25px rgba(226,29,67,.22);
}

.logo svg {
    width: 26px;
    height: 26px;
}

.brand-title {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: .7px;
}

.brand-sub {
    margin-top: 4px;

    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;

    color: var(--muted);
}

.nav {
    display: grid;
    gap: 5px;
}

.nav-button {
    width: 100%;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: var(--muted);

    padding: 12px 13px;

    display: flex;
    align-items: center;
    gap: 11px;

    font-weight: 800;

    transition: .2s ease;
}

.nav-button:hover {
    color: var(--text);
    background: var(--card-2);
    transform: translateX(2px);
}

.nav-button.active {
    color: var(--red);
    background: var(--red-soft);
}

.nav-icon {
    width: 20px;
    text-align: center;
    font-weight: 900;
}

.sidebar-bottom {
    margin-top: auto;

    border-top: 1px solid var(--border);

    padding-top: 15px;
}

.current-profile-box {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 12px;

    padding: 11px 12px;
}

.current-profile-box small {
    color: var(--muted);
    font-weight: 800;
}

.current-profile-box strong {
    display: block;
    margin-top: 4px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
    margin-left: 255px;
    min-height: 100vh;
}

.topbar {
    height: 72px;

    position: sticky;
    top: 0;
    z-index: 50;

    background: var(--bg);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 30px;
}

.date-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
}

.profile-select {
    background: var(--card);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: 10px;

    padding: 9px 12px;

    font-weight: 800;
}

.mobile-menu {
    display: none;

    width: 40px;
    height: 40px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--card);
    color: var(--text);
}

.page {
    max-width: 1500px;
    margin: auto;

    padding: 30px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h1 {
    margin: 4px 0 7px;

    font-size: 31px;
    font-weight: 900;
    letter-spacing: -.7px;
}

.page-title p {
    margin: 0;

    color: var(--muted);
    font-weight: 600;
}

.kicker {
    color: var(--red);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* =========================================================
   COMMON
   ========================================================= */

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 17px;

    padding: 20px;

    box-shadow: var(--shadow);

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.card:hover {
    transform: translateY(-3px);

    border-color: rgba(226,29,67,.45);
}

.card h3,
.card h4 {
    margin: 0 0 7px;
}

.card p {
    margin: 0;

    color: var(--muted);
    line-height: 1.55;
}

.grid {
    display: grid;
    gap: 18px;
}

.grid-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

.grid-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

.grid-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

.btn {
    border: 1px solid var(--border);

    background: var(--card-2);
    color: var(--text);

    border-radius: 10px;

    padding: 10px 14px;

    font-weight: 900;

    transition: .18s ease;
}

.btn:hover {
    border-color: var(--red);
    transform: translateY(-1px);
}

.btn.primary {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
}

.btn.primary:hover {
    background: var(--red-hover);
}

.btn.danger {
    color: var(--red);
    border-color: rgba(226,29,67,.4);
}

.btn:disabled {
    opacity: .42;
    transform: none;
}

.actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.badge,
.status {
    display: inline-flex;
    align-items: center;

    border-radius: 999px;

    padding: 5px 9px;

    font-size: 10px;
    font-weight: 900;

    letter-spacing: .45px;
    text-transform: uppercase;
}

.badge {
    background: var(--card-3);
    color: var(--muted);
    border: 1px solid var(--border);
}

.status.current {
    color: var(--red);
    background: var(--red-soft);
    border: 1px solid rgba(226,29,67,.3);
}

.status.locked {
    color: var(--muted);
    background: var(--card-3);
    border: 1px solid var(--border);
}

.status.done {
    color: var(--green);
    background: var(--green-soft);
    border: 1px solid rgba(39,184,121,.25);
}

.progress {
    width: 100%;
    height: 8px;

    overflow: hidden;

    background: var(--card-3);

    border-radius: 999px;
}

.progress span {
    display: block;

    height: 100%;

    background: var(--red);

    border-radius: inherit;

    transition: width .6s ease;
}

.section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin: 29px 0 13px;
}

.section-head h2 {
    margin: 0;

    font-size: 18px;
    font-weight: 900;
}

.section-head span {
    color: var(--muted);

    font-size: 11px;
    font-weight: 800;
}

/* =========================================================
   HOME
   ========================================================= */

.hero {
    position: relative;
    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            var(--card),
            var(--card-2)
        );

    border: 1px solid var(--border);
    border-radius: 21px;

    padding: 28px;
}

.hero::after {
    content: "";

    position: absolute;

    width: 240px;
    height: 240px;

    border-radius: 50%;

    right: -100px;
    top: -100px;

    background: var(--red-soft);
}

.hero h2 {
    position: relative;
    z-index: 1;

    margin: 5px 0 8px;

    font-size: 29px;
    font-weight: 900;
}

.hero p {
    position: relative;
    z-index: 1;

    max-width: 720px;
}

.current-box {
    background: var(--red-soft);

    border: 1px solid rgba(226,29,67,.45);

    border-radius: 17px;

    padding: 22px;
}

.current-box h2 {
    margin: 6px 0 8px;

    font-size: 23px;
}

.big-icon {
    margin-top: 8px;

    font-size: 31px;
}

/* =========================================================
   ROADMAP
   ========================================================= */

.phase-card {
    min-height: 280px;
}

.phase-card.locked {
    opacity: .68;
}

.phase-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
}

.phase-number {
    color: var(--red);

    font-size: 10px;
    font-weight: 900;

    letter-spacing: .8px;
}

.phase-card h3 {
    font-size: 18px;
}

.phase-description {
    min-height: 52px;

    margin-bottom: 15px !important;
}

.phase-foot {
    display: flex;
    justify-content: space-between;

    margin: 8px 0 11px;

    color: var(--muted);

    font-size: 11px;
    font-weight: 800;
}

/* =========================================================
   WEEKLY GAMES + LABS
   ========================================================= */

.phase-block {
    margin-bottom: 29px;
}

.phase-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;

    margin-bottom: 11px;

    padding: 14px 17px;

    background: var(--card-2);

    border: 1px solid var(--border);
    border-radius: 14px;
}

.phase-heading strong {
    font-size: 15px;
}

.phase-heading small {
    display: block;

    margin-top: 3px;

    color: var(--muted);
    font-weight: 700;
}

.week-list {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 12px;
}

.week-card {
    position: relative;

    overflow: hidden;
}

.week-card.current {
    border-color: var(--red);

    box-shadow:
        0 0 0 1px rgba(226,29,67,.13),
        var(--shadow);
}

.week-card.locked {
    opacity: .76;
}

.week-card.done {
    border-color: rgba(39,184,121,.3);
}

.week-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 12px;
}

.week-number {
    color: var(--red);

    font-size: 10px;
    font-weight: 900;

    letter-spacing: .8px;
}

.week-title {
    margin: 5px 0;

    font-size: 17px;
    font-weight: 900;
}

.week-topic {
    color: var(--muted);

    font-size: 11px;
    font-weight: 800;
}

.meta {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;

    margin: 11px 0;
}

.lock-reason {
    margin-top: 9px;

    color: var(--muted);

    font-size: 11px;
    line-height: 1.45;
}

/* =========================================================
   TOPIC LIST
   ========================================================= */

.topic-row {
    display: grid;

    grid-template-columns: 1fr auto;

    gap: 12px;

    align-items: center;

    padding: 12px 0;

    border-bottom: 1px solid var(--border);
}

.topic-row:last-child {
    border-bottom: 0;
}

.topic-row label {
    color: var(--text);

    font-size: 13px;
    font-weight: 800;
}

.topic-row small {
    display: block;

    margin-top: 3px;

    color: var(--muted);

    font-size: 11px;
}

.topic-checkbox {
    width: 21px;
    height: 21px;

    accent-color: var(--red);
}

/* =========================================================
   STATS
   ========================================================= */

.stat-number {
    margin-top: 7px;

    font-size: 28px;
    font-weight: 900;
}

.stat-label {
    color: var(--muted);

    font-size: 11px;
    font-weight: 800;
}

.metric-line {
    margin: 14px 0;
}

.metric-top {
    display: flex;
    justify-content: space-between;

    margin-bottom: 7px;

    font-size: 11px;
    font-weight: 900;
}

/* =========================================================
   PEOPLE
   ========================================================= */

.person {
    display: grid;

    grid-template-columns: auto 1fr;

    gap: 15px;

    align-items: center;
}

.avatar {
    width: 55px;
    height: 55px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    background: var(--red);
    color: #fff;

    font-size: 20px;
    font-weight: 900;
}

/* =========================================================
   CALENDAR
   ========================================================= */

.calendar-wrap {
    overflow-x: auto;

    padding-bottom: 5px;
}

.calendar-grid {
    display: grid;

    grid-template-columns:
        repeat(54, 13px);

    grid-auto-rows: 13px;

    gap: 4px;

    width: max-content;
}

.calendar-cell {
    width: 13px;
    height: 13px;

    border-radius: 3px;

    background: var(--card-3);

    border: 1px solid var(--border);
}

.calendar-cell.l1 {
    background: #661226;
}

.calendar-cell.l2 {
    background: #921836;
}

.calendar-cell.l3 {
    background: #c21d41;
}

.calendar-cell.l4 {
    background: #ee3157;
}

.calendar-legend {
    display: flex;
    align-items: center;
    gap: 5px;

    margin-top: 9px;

    color: var(--muted);

    font-size: 10px;
}

/* =========================================================
   GAME MODAL
   ========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.7);
}

.modal-backdrop.show {
    display: flex;
}

.modal {
    width: min(760px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    padding: 23px;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 18px;

    box-shadow: 0 25px 80px rgba(0,0,0,.45);
}

.modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.close-button {
    width: 36px;
    height: 36px;

    border: 1px solid var(--border);
    border-radius: 9px;

    background: var(--card-2);
    color: var(--text);

    font-size: 20px;
}

.game-stage {
    min-height: 320px;

    margin-top: 15px;

    padding: 20px;

    background: var(--card-2);

    border: 1px solid var(--border);
    border-radius: 16px;
}

.game-console {
    padding: 16px;

    background: #090909;
    color: #f5f5f5;

    border: 1px solid #333;
    border-radius: 12px;

    font-family: Consolas, monospace;

    font-size: 12px;
    line-height: 1.65;

    overflow-x: auto;
}

.choice-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 10px;

    margin-top: 14px;
}

.choice-button {
    padding: 14px;

    text-align: left;

    background: var(--card);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: 10px;

    font-weight: 800;

    transition: .18s;
}

.choice-button:hover {
    border-color: var(--red);
}

.choice-button.selected {
    background: var(--red-soft);
    border-color: var(--red);
}

.form-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 13px;
}

.field label {
    display: block;

    margin-bottom: 5px;

    color: var(--muted);

    font-size: 10px;
    font-weight: 900;

    text-transform: uppercase;
}

.field input,
.field textarea,
.field select {
    width: 100%;

    padding: 10px;

    background: var(--card);
    color: var(--text);

    border: 1px solid var(--border);
    border-radius: 9px;

    outline: none;
}

.field textarea {
    min-height: 100px;
    resize: vertical;
}

.notice {
    padding: 12px 14px;

    background: var(--red-soft);

    border: 1px solid rgba(226,29,67,.28);
    border-radius: 10px;

    color: var(--text);

    font-size: 12px;
    font-weight: 700;
}

/* =========================================================
   TABLE
   ========================================================= */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 650px;
}

th,
td {
    padding: 13px 12px;

    text-align: left;

    border-bottom: 1px solid var(--border);

    font-size: 12px;

    color: var(--text);
}

th {
    color: var(--muted);

    font-size: 10px;
    text-transform: uppercase;
}

/* =========================================================
   REWARDS
   ========================================================= */

.reward-card {
    display: flex;

    gap: 15px;

    align-items: center;
}

.reward-icon {
    width: 48px;

    text-align: center;

    font-size: 31px;
}

/* =========================================================
   SETTINGS
   ========================================================= */

.setting-row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;

    padding: 15px 0;

    border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
    border-bottom: 0;
}

.small {
    color: var(--muted);

    font-size: 11px;
}

.empty {
    padding: 30px;

    text-align: center;

    color: var(--muted);

    border: 1px dashed var(--border);

    border-radius: 14px;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;

    right: 22px;
    bottom: 22px;

    z-index: 300;

    padding: 13px 15px;

    background: var(--card);
    color: var(--text);

    border: 1px solid var(--border);
    border-left: 4px solid var(--red);

    border-radius: 11px;

    box-shadow: var(--shadow);

    transform: translateY(20px);
    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.toast.show {
    transform: translateY(0);
    opacity: 1;
}


/* =========================================================
   LEARNING ANIMATIONS
   ========================================================= */

@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(12px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes cardReveal {
    from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes modalReveal {
    from {
        opacity: 0;
        transform: translateY(22px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes progressGlow {
    0%, 100% {
        box-shadow: 0 0 0 rgba(226,29,67,0);
    }
    50% {
        box-shadow: 0 0 14px rgba(226,29,67,.35);
    }
}

@keyframes resourcePulse {
    0%, 100% {
        transform: translateX(0);
    }
    50% {
        transform: translateX(3px);
    }
}

.page {
    animation: pageEnter .38s ease both;
}

.reveal-item {
    opacity: 0;
    animation: cardReveal .48s cubic-bezier(.2,.75,.25,1) both;
    animation-delay: var(--delay, 0ms);
}

.phase-card {
    position: relative;
    overflow: hidden;
}

.phase-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(
            circle at 100% 0%,
            var(--red-soft),
            transparent 34%
        );
    transition: opacity .25s ease;
}

.phase-card:hover::before {
    opacity: 1;
}

.phase-card .progress span {
    animation: progressGlow 2.2s ease-in-out infinite;
}

.topic-row {
    position: relative;
    border-radius: 12px;
    padding: 13px 10px;
    margin: 3px 0;
    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
}

.topic-row:hover {
    transform: translateX(4px);
    background: var(--card-2);
}

.topic-row.completed {
    background: var(--green-soft);
}

.topic-main {
    min-width: 0;
}

.topic-resource {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 7px;
}

.topic-resource-label {
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
}

.resource-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-3);
    color: var(--text);
    font-size: 10px;
    font-weight: 900;
    transition:
        transform .18s ease,

        for (let i = 0; i < phase.weeks; i++) {

            const topicIndex =
                Math.floor(
                    i * phase.topics.length /
                    phase.weeks
                );

            result.push({

                week,

                phase:
                    phase.number,

                phaseTitle:
                    phase.title,

                topic:
                    phase.topics[
                        Math.min(
                            topicIndex,
                            phase.topics.length - 1
                        )
                    ],

                game:
                    GAME_NAMES[week - 1] ||
                    `Week ${week} Security Mission`,

                difficulty:
                    phase.number < 6
                        ? "Beginner"
                        : phase.number < 10
                            ? "Intermediate"
                            : phase.number < 14
                                ? "Advanced"
                                : "Expert",

                estimated:
                    phase.number < 6
                        ? "15–25 min"
                        : phase.number < 12
                            ? "25–40 min"
                            : "30–60 min"
            });

            week++;
        }

    });

    return result;
}

/* =========================================================

   ========================================================= */

function topicKey(
    phase,
    index
) {

    return `${phase}-${index}`;

}


function isPhaseComplete(
    profile,
    phaseNumber
) {

    const phase =
        PHASES[phaseNumber];

    return phase.topics.every(
        (_, index) =>
            profile.topics[
                topicKey(
                    phaseNumber,
                    index
                )
            ] === true
    );

}


function phasePercent(
    profile,
    phaseNumber
) {

    const phase =
        PHASES[phaseNumber];

    const completed =
        phase.topics.filter(
            (_, index) =>
                profile.topics[
                    topicKey(
                        phaseNumber,
                        index
                    )
                ]
        ).length;

    return Math.round(
        completed /
        phase.topics.length *
        100
    );

}


function isPhaseUnlocked(
    phaseNumber
) {

    if (phaseNumber === 0) {

        return true;

    }

    return isPhaseComplete(
        currentProfile(),
        phaseNumber - 1
    );

}


function getCurrentPhase() {

    for (const phase of PHASES) {

        if (
            !isPhaseComplete(
                currentProfile(),
                phase.number
            )
        ) {

            return phase.number;

        }

    }

    return 15;

}


/* =========================================================
   STREAK
   ========================================================= */

function updateStreak(
    profile
) {

    const dates =
        Object.keys(
            profile.activity
        ).sort();

    if (!dates.length) {

        profile.streak = {
            current: 0,
            longest: 0,
            last: null
        };

        return;

    }

    let current =
        0;

    let cursor =
        new Date();

    while (
        profile.activity[
            cursor
                .toISOString()
                .slice(0,10)
        ]
    ) {

        current++;

        cursor.setDate(
            cursor.getDate() - 1
        );

    }

    let longest = 0;
    let run = 0;
    let previous = null;

    dates.forEach(
        dateString => {

            const date =
                new Date(
                    dateString +
                    "T00:00:00"
                );

            if (
                previous &&
                date.getTime() -
                previous.getTime()
                === 86400000
            ) {

                run++;

            } else {

                run = 1;

            }

            longest =
                Math.max(
                    longest,
                    run
                );

            previous =
                date;

        }
    );

    profile.streak.current =
        current;

    profile.streak.longest =
        Math.max(
            longest,
            profile.streak.longest || 0
        );

    profile.streak.last =
        dates[dates.length - 1];

}

/* =========================================================
   GAME UNLOCK SYSTEM
   ========================================================= */

function isGameUnlocked(
    week
) {

    const profile =
        currentProfile();

    if (
        profile.games[week]
    ) {

        return true;

    }

    const unlockDate =
        profile.gameUnlocks[
            week
        ];

    if (!unlockDate) {

        return false;

    }

    return (
        new Date(
            unlockDate +
            "T00:00:00"
        ) <=
        new Date()
    );

}


function getCurrentGameWeek() {

    const profile =
        currentProfile();

    for (
        let week = 1;
        week <= 54;
        week++
    ) {

        if (
            !profile.games[week] &&
            isGameUnlocked(week)
        ) {

            return week;

        }

    }

    return 54;

}


/*
   Important:
   Only the next game is unlocked.

   All 54 games are still rendered.
*/


function unlockNextGame(
    completedWeek
) {

    const next =
        completedWeek + 1;

    if (
        next > 54
    ) {

        return;

    }

    const date =
        new Date();

    const day =
        date.getDay();

    let daysUntilSaturday =
        (6 - day + 7) % 7;

    if (
        daysUntilSaturday === 0
    ) {

        daysUntilSaturday = 7;

    }

    date.setDate(
        date.getDate() +
        daysUntilSaturday
    );

    currentProfile()
        .gameUnlocks[next] =
        date
            .toISOString()
            .slice(0,10);

}


/* =========================================================
   LAB UNLOCK
   ========================================================= */

function isLabUnlocked(
    week
) {

    const profile =
        currentProfile();

    if (
        profile.labs[week]
    ) {

        return true;

    }

    if (
        week === 1
    ) {

        return true;

    }

    return (
        profile.labs[week - 1] ||
        profile.games[week - 1]
    );

}


/* =========================================================
   BADGES
   ========================================================= */

function evaluateBadges() {

    const profile =
        currentProfile();

    const completedGames =
        Object.values(
            profile.games
        ).filter(Boolean).length;

    const completedLabs =
        Object.values(
            profile.labs
        ).filter(Boolean).length;

    const completedPhases =
        PHASES.filter(
            phase =>
                isPhaseComplete(
                    profile,
                    phase.number
                )
        ).length;

    const rules = [

        [
            "First Step",
            Object.keys(
                profile.activity
            ).length >= 1
        ],

        [
            "First Game",
            completedGames >= 1
        ],

        [
            "First Lab",
            completedLabs >= 1
        ],

        [
            "Phase 01",
            isPhaseComplete(
                profile,
                1
            )
        ],

        [
            "3-Day Streak",
            profile.streak.longest >= 3
        ],

        [
            "7-Day Streak",
            profile.streak.longest >= 7
        ],

        [
            "30-Day Streak",
            profile.streak.longest >= 30
        ],

        [
            "10 Games",
            completedGames >= 10
        ],

        [
            "10 Labs",
            completedLabs >= 10
        ],

        [
            "Roadmap Complete",
            completedPhases === 16
        ],

        [
            "The Final Hunt",
            profile.games[54] === true
        ]

    ];

    rules.forEach(
        ([name, condition]) => {

            if (
                condition &&
                !profile.badges.includes(
                    name
                )
            ) {

                profile.badges.push(
                    name
                );

            }

        }
    );

}

function stopLearningSession() {

    const profile =
        currentProfile();

    if (
        !profile.activeSession
    ) {

        return;

    }

    const duration =
        Math.max(
            1,
            Math.floor(
                (
                    Date.now() -
                    profile.activeSession.start
                ) / 1000
            )
        );

    profile.sessions.push({

        date:
            todayKey(),

        start:
            profile.activeSession.start,

        end:
            Date.now(),

        duration

    });

    profile.activeSession =
        null;

    addActivity(
        Math.max(
            1,
            Math.floor(
                duration / 60
            )
        )
    );

    saveState();

    render();

    showToast(
        "Learning session saved."
    );

}


function totalHours(
    profile
) {

    return profile.sessions
        .reduce(
            (sum, session) =>
                sum +
                session.duration,
            0
        ) / 3600;

}

/* =========================================================
   CALENDAR
   ========================================================= */

function renderCalendar(
    profile
) {

    const start =
        new Date(
            JOURNEY_START +
            "T00:00:00"
        );

    let cells = "";

    /*
       378 cells = 54 weeks.
       Fresh installation therefore shows
       an empty calendar.
    */

    for (
        let i = 0;
        i < 378;
        i++
    ) {

        const date =
            new Date(start);

        date.setDate(
            date.getDate() +
            i
        );

        const key =
            date
                .toISOString()
                .slice(0,10);

        let level = "";

        if (
            profile.activity[key]
        ) {

            level =
                "l" +
                (
                    1 +
                    (i % 4)
                );

        }

        cells += `

            <div
                class="calendar-cell ${level}"
                title="${key}">
            </div>

        `;

    }

    return `

        <div class="calendar-wrap">

            <div class="calendar-grid">

                ${cells}

            </div>

        </div>

        <div class="calendar-legend">

            Less

            <span class="calendar-cell"></span>
            <span class="calendar-cell l1"></span>
            <span class="calendar-cell l2"></span>
            <span class="calendar-cell l3"></span>
            <span class="calendar-cell l4"></span>

            More

        </div>

    `;

}

function profileSummary(
    name
) {

    const profile =
        state.profiles[name];

    const topicTotal =
        PHASES.reduce(
            (sum, phase) =>
                sum +
                phase.topics.length,
            0
        );

    const completedTopics =
        Object.values(
            profile.topics
        ).filter(Boolean).length;

    const phases =
        PHASES.filter(
            phase =>
                isPhaseComplete(
                    profile,
                    phase.number
                )
        ).length;

    const games =
        Object.values(
            profile.games
        ).filter(Boolean).length;

    const labs =
        Object.values(
            profile.labs
        ).filter(Boolean).length;

    return {

        percent:
            Math.round(
                completedTopics /
                topicTotal *
                100
            ),

        phases,

        games,

        labs,

        hours:
            totalHours(profile)

    };

}

/* =========================================================
   CHALLENGE DISPLAY
   ========================================================= */

function challengeProgressText(
    index,
    profile
) {

    const name =
        CHALLENGES[index][0];

    if (
        name.includes("Hour")
    ) {

        return (
            totalHours(profile)
                .toFixed(1)
            + " h"
        );

    }

    if (
        name.includes("Streak") ||
        name.includes("365-Day")
    ) {

        return (
            profile.streak.longest ||
            0
        )
        + " days";

    }

    if (
        name.includes("Game")
    ) {

        return (
            Object.values(
                profile.games
            ).filter(Boolean).length
        )
        + " games";

    }

    if (
        name.includes("Lab")
    ) {

        return (
            Object.values(
                profile.labs
            ).filter(Boolean).length
        )
        + " labs";

    }

    if (
        name.includes("Phase")
    ) {

        return (
            PHASES.filter(
                phase =>
                    isPhaseComplete(
                        profile,
                        phase.number
                    )
            ).length
        )
        + " phases";

    }

    return (
        profile.points
        + " points"
    );

}

    id
) {

    const reward =

        reward.giver !==
        state.currentProfile

        return;

    reward.status =
        "GIVEN";

    reward.givenDate =
        todayKey();

    saveState();

    render();

    showToast(
        "Reward marked as given."
    );

/* =========================================================
   THEME
   ========================================================= */

function applyTheme() {

    document.documentElement
        .setAttribute(
            "data-theme",
            state.theme
        );

}


function toggleTheme() {

    state.theme =
        state.theme === "dark"
        ? "light"
        : "dark";

    applyTheme();

    saveState();

    render();

}


/* =========================================================
   RESET
   ========================================================= */

function resetAllData() {

    const confirmed =
        confirm(
            "Reset all Cyber Duo learning data for both Madhu and Roshan?"
        );

    if (
        !confirmed
    ) {

        return;

    }

    const theme =
        state.theme;

    state =
        createDefaultState();

    state.theme =
        theme;

    applyTheme();

    saveState();

    render();

    showToast(
        "All learning data has been reset."
    );

}

function cdRenderBuilder(m){const code=cdAnswers.code||`<!doctype html><html><body><h1>Cyber Duo App</h1><button id="launch">Launch</button></body></html>`;cdModalBase(m,`<div class="cd-stage-label">BUILD / DEBUG</div><p>Repair the fictional web page until it contains the required structure.</p><div class="cd-editor"><textarea id="cdCode">${escapeHTML(code)}</textarea><div class="cd-preview" id="cdPreview"></div></div><div class="notice" style="margin-top:12px">Required: an <b>&lt;h1&gt;</b> and a button with <b>id="launch"</b>.</div>`,`<button class="btn" type="button" onclick="cdRunBuilder()">RUN PREVIEW</button><button class="btn primary" type="button" onclick="cdCheckBuilder()">VERIFY</button>`);setTimeout(()=>{const x=document.getElementById("cdPreview");if(x){const re=new RegExp("<scr"+"ipt[\\s\\S]*?<\\/scr"+"ipt>","gi");x.innerHTML=code.replace(re,"")}},0)}
function cdRunBuilder(){cdAnswers.code=document.getElementById("cdCode")?.value||"";cdRenderBuilder(cdGameMeta(cdGameId))}function cdCheckBuilder(){cdAnswers.code=document.getElementById("cdCode")?.value||"";if(/<h1[ >]/i.test(cdAnswers.code)&&/<button[^>]*id=["']launch["']/i.test(cdAnswers.code)){cdStage=4;cdRenderSuccessGeneric(cdGameMeta(cdGameId),"The fictional page now meets the build requirements.")}else showToast("❌ Not quite. Fix the required elements first.")}
function cdRenderTerminal(m){if(cdAnswers.terminalSolved)return cdRenderSuccessGeneric(m,"The simulated terminal investigation is complete.");cdModalBase(m,`<div class="cd-stage-label">TERMINAL SIMULATION</div><div class="cd-terminal" id="cdTerminalOut">SecureSpace Linux Training Shell<br>$ whoami<br>trainee<br>$ _</div><div class="field" style="margin-top:12px"><label>Command</label><input id="cdCmd" placeholder="Try pwd, ls, cat permissions.txt"></div>`,`<button class="btn primary" type="button" onclick="cdTerminalCommand()">RUN COMMAND</button>`)}
function cdTerminalCommand(){const c=(document.getElementById("cdCmd")?.value||"").trim(),o=document.getElementById("cdTerminalOut");if(!c)return showToast("Enter a command.");let t=`$ ${c}\n`;if(c==="pwd")t+="/home/trainee";else if(c==="ls")t+="notes.txt  permissions.txt  audit.log";else if(c==="cat permissions.txt")t+="backup.sh: rw-r--r--\nsecret.txt: rw-------";else if(c==="cat audit.log")t+="09:42 permission denied for secret.txt";else t+="simulated output";o.innerHTML+=`<div style="margin-top:7px">${escapeHTML(t).replaceAll("\n","<br>")}</div>`;if(c==="cat permissions.txt"){cdAnswers.terminalSolved=true;cdRenderTerminal(cdGameMeta(cdGameId))}}
function cdRenderNetwork(m){cdAnswers.path||=[];const body=`<div class="cd-stage-label">NETWORK SIMULATION</div><p>Trace the packet in the correct order.</p><div class="cd-network">${["Browser","DNS","Firewall","API Gateway","Application","Database"].map((n,i)=>`<button class="cd-node ${cdAnswers.path.includes(n)?"selected":""}" type="button" onclick="cdSelectNode('${n}')">${n}<small style="display:block;color:var(--muted);margin-top:4px">node ${i+1}</small></button>`).join("")}</div><div class="notice" style="margin-top:12px">Correct route: Browser → DNS → Firewall → API Gateway → Application.</div>`;cdModalBase(m,body,`<button class="btn primary" type="button" onclick="cdVerifyNetwork()">CHECK PATH</button>`)}
function cdSelectNode(n){const p=cdAnswers.path,expected=["Browser","DNS","Firewall","API Gateway","Application"];if(p[p.length-1]===n)return;if(n!==expected[p.length]){cdAnswers.path=[];showToast("❌ That is not the next node.");cdRenderNetwork(cdGameMeta(cdGameId));return}p.push(n);cdRenderNetwork(cdGameMeta(cdGameId))}function cdVerifyNetwork(){if((cdAnswers.path||[]).length===5){cdStage=1;cdRenderSuccessGeneric(cdGameMeta(cdGameId),"Packet path verified.")}else showToast("Finish the packet path first.")}
function cdRenderRecon(m){cdAnswers.assets||=[];const body=`<div class="cd-stage-label">RECON MAP</div><p>Discover at least three related fictional assets.</p><div class="cd-map">${[["portal","18%","22%"],["api","58%","18%"],["cdn","36%","56%"],["admin","70%","58%"],["docs","12%","70%"]].map(x=>`<button type="button" class="cd-map-node ${cdAnswers.assets.includes(x[0])?"selected":""}" style="left:${x[1]};top:${x[2]}" onclick="cdToggleAsset('${x[0]}')">${x[0]}.training</button>`).join("")}</div>`;cdModalBase(m,body,`<button class="btn primary" type="button" onclick="cdCheckRecon()">BUILD MAP</button>`)}function cdToggleAsset(n){const a=cdAnswers.assets,i=a.indexOf(n);if(i>=0)a.splice(i,1);else a.push(n);cdRenderRecon(cdGameMeta(cdGameId))}function cdCheckRecon(){if((cdAnswers.assets||[]).length>=3){cdStage=1;cdRenderSuccessGeneric(cdGameMeta(cdGameId),"The attack surface map is complete.")}else showToast("Discover at least three assets.")}
function cdRenderReport(m){cdModalBase(m,`<div class="cd-stage-label">REPORT BUILDER</div><p>Construct a professional training report.</p><div class="form-grid"><div class="field"><label>Title</label><input id="cdRTitle" value="${escapeHTML(cdAnswers.rtitle||"")}"></div><div class="field"><label>Asset</label><input id="cdRAsset" value="${escapeHTML(cdAnswers.asset||"app.training")}"></div><div class="field"><label>Steps</label><textarea id="cdRSteps">${escapeHTML(cdAnswers.rsteps||"")}</textarea></div><div class="field"><label>Impact</label><textarea id="cdRImpact">${escapeHTML(cdAnswers.rimpact||"")}</textarea></div></div>`,`<button class="btn primary" type="button" onclick="cdCheckReport()">SUBMIT REPORT</button>`)}function cdCheckReport(){cdAnswers.rtitle=document.getElementById("cdRTitle")?.value.trim()||"";cdAnswers.asset=document.getElementById("cdRAsset")?.value.trim()||"";cdAnswers.rsteps=document.getElementById("cdRSteps")?.value.trim()||"";cdAnswers.rimpact=document.getElementById("cdRImpact")?.value.trim()||"";if(cdAnswers.rtitle.length>10&&cdAnswers.asset&&cdAnswers.rsteps.length>25&&cdAnswers.rimpact.length>20){cdStage=1;cdRenderSuccessGeneric(cdGameMeta(cdGameId),"The fictional triager accepted the report.")}else showToast("Add a title, asset, reproducible steps and impact.")}
function cdRenderAPI(m){const n=cdAnswers.apiStep||0,labels=["Discover endpoint","Modify JSON","Validate authorization"];if(n>=3)return cdRenderSuccessGeneric(m,"The simulated API investigation is complete.");cdModalBase(m,`<div class="cd-stage-label">API LAB</div><div class="cd-request">GET /api/v1/profile/1042 HTTP/1.1<br>Authorization: Bearer TRAINING-TOKEN<br>Accept: application/json</div><div class="notice" style="margin-top:12px">Stage ${n+1}/3 — ${labels[n]}</div><div class="field" style="margin-top:12px"><label>Profile ID</label><input id="cdApiId" value="${escapeHTML(cdAnswers.apiId||"1042")}"></div>`,`<button class="btn primary" type="button" onclick="cdAdvanceAPI()">SEND / INSPECT</button>`)}function cdAdvanceAPI(){cdAnswers.apiId=document.getElementById("cdApiId")?.value.trim()||"1042";cdAnswers.apiStep=(cdAnswers.apiStep||0)+1;cdRenderAPI(cdGameMeta(cdGameId))}
function cdRenderInvestigation(m){cdAnswers.clues||=[];const clues=["Inspect supplied evidence","Compare request and response","Test the fictional input","Validate the impact"];cdModalBase(m,`<div class="cd-stage-label">INVESTIGATION</div><p>Complete the evidence chain for <b>${escapeHTML(m.topic)}</b>.</p><div class="cd-evidence">${clues.map((c,i)=>`<button type="button" class="${cdAnswers.clues.includes(i)?"active":""}" onclick="cdToggleClue(${i})">${cdAnswers.clues.includes(i)?"✓":"○"} ${c}</button>`).join("")}</div>`,`<button class="btn primary" type="button" onclick="cdCheckInvestigation()">SUBMIT INVESTIGATION</button>`)}function cdToggleClue(i){const a=cdAnswers.clues,k=a.indexOf(i);if(k>=0)a.splice(k,1);else a.push(i);cdRenderInvestigation(cdGameMeta(cdGameId))}function cdCheckInvestigation(){if((cdAnswers.clues||[]).length>=3){cdStage=1;cdRenderSuccessGeneric(cdGameMeta(cdGameId),"Evidence chain validated.")}else showToast("Collect at least three pieces of evidence.")}
function cdRenderSuccessGeneric(m,msg){cdModalBase(m,`<div class="cd-success"><div style="font-size:34px">✅</div><h3>Mission Complete</h3><p>${escapeHTML(msg)}</p><p style="margin-top:7px">Save the result to make it permanent.</p></div>`,`<button class="btn primary" type="button" onclick="cdSaveGameResult()">SAVE RESULT</button>`)}
function cdSaveGameResult(){const p=currentProfile();if(!cdGameId)return;if(p.games[cdGameId]){closeModal();return}p.games[cdGameId]=true;p.points+=50;p.activity[todayKey()]=(Number(p.activity[todayKey()])||0)+1;updateStreak(p);if(!p.gameWinStreak)p.gameWinStreak=0;p.gameWinStreak+=1;cdScheduleNextGame(cdGameId,p);saveState();cdEvaluateChallenges();evaluateBadges?.();saveState();closeModal();render();showToast("✅ Mission result saved.")}
function cdInjectCelebration(){if(document.getElementById("cdCelebration"))return;const l=document.createElement("div");l.id="cdCelebration";l.innerHTML='<div class="cd-celebrate-card" id="cdCelebrationCard"></div>';document.body.appendChild(l)}
cdEnsureState();cdInjectCelebration();cdStartTimerUI();render();
</script>


<script id="cyber-duo-exact-challenge-patch">
const CD_EXACT_CHALLENGES=["First 2-Hour Day", "First 3-Hour Day", "First 5-Hour Day", "First 10 Total Hours", "First 25 Total Hours", "First 50 Total Hours", "First 100 Total Hours", "First 150 Total Hours", "First 250 Total Hours", "First 500 Total Hours", "First 3-Day Streak", "First 7-Day Streak", "First 15-Day Streak", "First 21-Day Streak", "First 30-Day Streak", "First 45-Day Streak", "First 60-Day Streak", "First 75-Day Streak", "First 100-Day Streak", "First 150-Day Streak", "First 200-Day Streak", "First 365-Day Journey", "First Phase", "First 2 Phases", "First 3 Phases", "First 5 Phases", "First 6 Phases", "First 7 Phases", "First Halfway (8/16)", "First 10 Phases", "First 12 Phases", "First 14 Phases", "First 15 Phases", "First to Complete All 16 Phases", "First Game Win", "First 3 Game Wins", "First 5 Game Wins", "First 10 Game Wins", "First 15 Game Wins", "First 20 Game Wins", "First 25 Game Wins", "First 30 Game Wins", "First 2-Game Winning Streak", "First 3-Game Winning Streak", "First 5-Game Winning Streak", "First 7-Game Winning Streak", "First 10-Game Winning Streak", "First 3 Weekly Games Completed", "First 5 Weekly Games Completed", "First 10 Weekly Games Completed", "First 20 Weekly Games Completed", "First 30 Weekly Games Completed", "First 40 Weekly Games Completed", "First to Complete Every Weekly Game", "First Full Week", "First 2 Perfect Weeks", "First 4 Perfect Weeks", "First 8 Perfect Weeks", "First 12 Perfect Weeks", "First 20 Perfect Weeks", "First 5 Labs Completed", "First 10 Labs", "First 20 Labs", "First 30 Labs", "First 50 Labs", "First 75 Labs", "First 100 Labs", "First Report", "First 5 Reports", "First 10 Reports", "First 20 Reports", "First 30 Reports", "First 50 Reports", "First 500 Points", "First 1,000 Points", "First 2,500 Points", "First 5,000 Points", "First 10,000 Points", "First 25,000 Points", "First 50,000 Points", "First to Finish a Phase Within Its Planned Time", "First to Finish 3 Phases Within Planned Time", "First to Finish 5 Phases Within Planned Time", "First to Reach Phase 5 Without Missing a Weekly Game", "First to Reach Phase 8 While Maintaining a 30-Day Streak", "First to Reach Phase 10 With 10 Game Wins", "First to Reach Phase 16 With 100+ Learning Hours", "First Comeback", "First 3-Phase Comeback", "First Streak Comeback", "First Game Comeback", "Biggest Comeback", "First to Complete 3 Things in One Day", "First to Complete a Phase + Weekly Game", "First to Reach 7-Day Streak + Win a Game", "First to Reach 30-Day Streak + Complete a Phase", "First to Reach 100 Hours + 5 Game Wins", "First to Reach 5 Phases + 10 Game Wins", "First to Reach 10 Phases + 100 Learning Hours", "First to Reach 15 Phases + 20 Game Wins", "FIRST TO THE FINISH — complete all 16 phases first", "CYBER DUO CHAMPION — complete all 16 phases + required weekly games + required learning-hour target"].map(n=>[n,n]);
function cdChallengeCondition(i){const a=[["hours",2],["hours",3],["hours",5],["hours",10],["hours",25],["hours",50],["hours",100],["hours",150],["hours",250],["hours",500],["streak",3],["streak",7],["streak",15],["streak",21],["streak",30],["streak",45],["streak",60],["streak",75],["streak",100],["streak",150],["streak",200],["streak",365],["phases",1],["phases",2],["phases",3],["phases",5],["phases",6],["phases",7],["phases",8],["phases",10],["phases",12],["phases",14],["phases",15],["phases",16],["games",1],["games",3],["games",5],["games",10],["games",15],["games",20],["games",25],["games",30],["winStreak",2],["winStreak",3],["winStreak",5],["winStreak",7],["winStreak",10],["games",3],["games",5],["games",10],["games",20],["games",30],["games",40],["games",196],["perfectWeeks",1],["perfectWeeks",2],["perfectWeeks",4],["perfectWeeks",8],["perfectWeeks",12],["perfectWeeks",20],["labs",5],["labs",10],["labs",20],["labs",30],["labs",50],["labs",75],["labs",100],["reports",1],["reports",5],["reports",10],["reports",20],["reports",30],["reports",50],["points",500],["points",1000],["points",2500],["points",5000],["points",10000],["points",25000],["points",50000],["speed",1],["speed",3],["speed",5],["speed",84],["speed",85],["speed",86],["speed",87],["comeback",1],["comeback",3],["comeback",1],["comeback",1],["comeback",1],["daily",3],["combined",1],["combined",2],["combined",3],["combined",4],["combined",5],["combined",6],["combined",7],["combined",8],["phases",16],["final",1]];return a[i]||["phases",16]}
function cdProg(p,i){const [t,x]=cdChallengeCondition(i),ph=PHASES.filter(q=>isPhaseComplete(p,q.number)).length,h=(p.sessions||[]).reduce((s,v)=>s+(v.duration||0),0)/3600,g=cdCompletedCount(p),l=Object.values(p.labs||{}).filter(Boolean).length;switch(t){case"hours":return h;case"streak":return p.streak?.longest||0;case"phases":return ph;case"games":return g;case"winStreak":return p.gameWinStreak||0;case"perfectWeeks":return p.perfectWeeks||0;case"labs":return l;case"reports":return p.reports||0;case"points":return p.points||0;case"daily":return Math.max(0,...Object.values(p.activity||{}).map(v=>Number(v)||0));case"speed":return 0;default:return 0}}
function cdEvaluateChallenges(){state.challenges.winners||={};state.challenges.rewards||={};CD_EXACT_CHALLENGES.forEach((c,i)=>{const id=String(i+1);if(state.challenges.winners[id])return;const target=cdChallengeCondition(i)[1],m=cdProg(state.profiles.Madhu,i),r=cdProg(state.profiles.Roshan,i);let w=null;if(m>=target)w="Madhu";else if(r>=target)w="Roshan";if(!w)return;const saved=state.challenges.rewards[id]||{rewardIcon:REWARD_LIST[i%REWARD_LIST.length][0],rewardTitle:REWARD_LIST[i%REWARD_LIST.length][1]};state.challenges.winners[id]={winner:w,date:todayKey(),timestamp:Date.now()};state.challenges.rewards[id]={rewardIcon:saved.rewardIcon,rewardTitle:saved.rewardTitle,rewardDescription:saved.rewardDescription||saved.rewardTitle,rewardGiver:w==="Madhu"?"Roshan":"Madhu",rewardReceiver:w,rewardStatus:"PENDING",assignedDate:todayKey(),givenDate:null};setTimeout(()=>cdMaybeCelebrate("CHALLENGE WON!",`${w} reached the condition first.`,state.challenges.rewards[id].rewardTitle),100)});saveState()}
function completeTopic(phase,index){const p=currentProfile(),k=topicKey(phase,index);if(!isPhaseUnlocked(phase)||p.topics[k])return;p.topics[k]=true;p.points+=10;p.activity[todayKey()]=(Number(p.activity[todayKey()])||0)+1;updateStreak(p);evaluateBadges?.();cdEvaluateChallenges();saveState();render();showToast("Topic completed.")}
function completeLab(week){const p=currentProfile();if(p.labs[week])return;p.labs[week]=true;p.points+=25;p.activity[todayKey()]=(Number(p.activity[todayKey()])||0)+1;updateStreak(p);evaluateBadges?.();cdEvaluateChallenges();saveState();render();showToast("Lab marked complete.")}
function cdSaveChallengeReward(id,index){if(state.challenges.winners[String(id)])return showToast("This challenge is already closed.");const r=REWARD_LIST[Number(index)];if(!r)return;state.challenges.rewards[String(id)]={rewardIcon:r[0],rewardTitle:r[1],rewardDescription:r[1],rewardStatus:"PENDING",rewardGiver:null,rewardReceiver:null,assignedDate:todayKey(),givenDate:null};saveState();render();showToast("🎁 Reward saved for this challenge.")}
function cdMarkRewardGiven(id){const r=state.challenges.rewards[String(id)];if(!r)return;if(r.rewardGiver!==state.currentProfile)return showToast("Only the giver can mark this reward as given.");if(r.rewardStatus==="GIVEN")return;r.rewardStatus="GIVEN";r.givenDate=todayKey();saveState();render();setTimeout(()=>cdMaybeCelebrate("REWARD GIVEN!",`${r.rewardGiver} gave ${r.rewardTitle} to ${r.rewardReceiver}.`,r.rewardTitle),100)}
function formatChallengeNumber(value){
  const n=Number(value)||0;
  if(Math.abs(n-Math.round(n))<1e-9)return String(Math.round(n));
  return n.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
}
function cdChallengeDescription(i){
  const name=CD_EXACT_CHALLENGES[i]?.[0]||`Challenge ${i+1}`;
  const [type,target]=cdChallengeCondition(i);
  const labels={hours:`learning hours`,streak:`longest streak days`,phases:`completed phases`,games:`game wins`,winStreak:`consecutive game wins`,perfectWeeks:`perfect weeks`,labs:`labs completed`,reports:`reports`,points:`points`,daily:`things completed in one day`,speed:`target milestone`,comeback:`comeback milestones`,combined:`combined milestone`,final:`final journey milestone`};
  return `${name} · Target: ${formatChallengeNumber(target)} ${labels[type]||"milestone"}`;
}
function renderChallenges(){return pageShell("Challenges","102 exact challenges shared by Madhu and Roshan. Save a reward before a challenge is won.",`<div class="section-head"><h2>Challenge Board</h2><span>${CD_EXACT_CHALLENGES.length} total challenges</span></div><div class="grid grid-2">${CD_EXACT_CHALLENGES.map((c,i)=>{const id=i+1,w=state.challenges.winners[String(id)],r=state.challenges.rewards[String(id)],target=cdChallengeCondition(i)[1],m=cdProg(state.profiles.Madhu,i),q=cdProg(state.profiles.Roshan,i);return `<article class="card reveal-item" style="--delay:${i%12*30}ms"><div style="display:flex;justify-content:space-between;gap:12px"><div><span class="badge">#${id}</span><h3 style="margin-top:9px">${escapeHTML(c[0])}</h3><p>${escapeHTML(cdChallengeDescription(i))}</p></div><span class="status ${w?"done":"current"}">${w?"CLOSED":"ACTIVE"}</span></div><div class="grid grid-2" style="margin-top:15px"><div><div class="stat-label">MADHU</div><div class="stat-number" style="font-size:19px">${formatChallengeNumber(m)} / ${formatChallengeNumber(target)}</div><div class="progress"><span style="width:${Math.min(100,m/Math.max(1,target)*100)}%"></span></div></div><div><div class="stat-label">ROSHAN</div><div class="stat-number" style="font-size:19px">${formatChallengeNumber(q)} / ${formatChallengeNumber(target)}</div><div class="progress"><span style="width:${Math.min(100,q/Math.max(1,target)*100)}%"></span></div></div></div>${w?`<div class="winner-box" style="margin-top:14px"><div class="winner-text">🏆 ${escapeHTML(w.winner)} reached the condition first.</div><div class="reward-text">Won: ${formatDate(w.date)}</div><div class="cd-reward-flow"><div class="cd-reward-person"><div class="stat-label">FROM</div><div class="reward-person-name">${w.winner==="Madhu"?"👨 Roshan":"👩 Madhu"}</div></div><div class="cd-reward-arrow">→</div><div class="cd-reward-person"><div class="stat-label">TO</div><div class="reward-person-name">${w.winner==="Madhu"?"👩 Madhu":"👨 Roshan"}</div></div></div><div class="reward-text">🎁 ${escapeHTML(r?.rewardIcon||"🎁")} ${escapeHTML(r?.rewardTitle||"Reward")}</div><div class="reward-text">Status: ${escapeHTML(r?.rewardStatus||"PENDING")}</div></div>`:`<div class="reward-config"><label>REWARD</label><select id="cdReward-${id}">${REWARD_LIST.map((rw,j)=>`<option value="${j}" ${r?.rewardTitle===rw[1]?"selected":(!r&&j===(id-1)%REWARD_LIST.length?"selected":"")}>${rw[0]} ${escapeHTML(rw[1])}</option>`).join("")}</select><button class="btn" type="button" style="margin-top:8px;width:100%" onclick="cdSaveChallengeReward(${id},document.getElementById('cdReward-${id}').value)">${r?"UPDATE SAVED REWARD":"SAVE REWARD"}</button>${r?`<div class="small" style="margin-top:7px">✓ Saved: ${escapeHTML(r.rewardIcon)} ${escapeHTML(r.rewardTitle)}</div>`:""}</div>`}</article>`}).join("")}</div>`)}
function renderRewards(){const entries=Object.entries(state.challenges.rewards||{}),wins=state.challenges.winners||{};if(!entries.length)return pageShell("Rewards","Every reward clearly shows who gives it and who receives it.",`<div class="empty"><div class="empty-icon">🎁</div><h3>No saved rewards yet</h3><p>Choose and save a reward inside an active challenge.</p></div>`);return pageShell("Rewards","A clear FROM → TO reward ledger for every challenge.",`<div class="grid grid-2">${entries.map(([id,r],i)=>{const w=wins[id],can=r.rewardStatus==="PENDING"&&r.rewardGiver===state.currentProfile,ch=CD_EXACT_CHALLENGES[Number(id)-1]?.[0]||`Challenge ${id}`;return `<article class="card cd-reward-card reveal-item" style="--delay:${i%10*40}ms"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><span class="badge">🏆 ${escapeHTML(ch)}</span><h3 style="font-size:20px;margin-top:9px">${escapeHTML(r.rewardIcon||"🎁")} ${escapeHTML(r.rewardTitle||"Reward")}</h3><p>${escapeHTML(r.rewardDescription||"")}</p></div><span class="status ${r.rewardStatus==="GIVEN"?"done":"current"}">${escapeHTML(r.rewardStatus||"PENDING")}</span></div><div class="cd-reward-flow"><div class="cd-reward-person"><div class="stat-label">FROM</div><div style="font-weight:900;margin-top:4px">${r.rewardGiver?(r.rewardGiver==="Madhu"?"👩":"👨")+" "+escapeHTML(r.rewardGiver):"Waiting for winner"}</div><div class="small">Who gives the reward</div></div><div class="cd-reward-arrow">→</div><div class="cd-reward-person"><div class="stat-label">TO</div><div style="font-weight:900;margin-top:4px">${r.rewardReceiver?(r.rewardReceiver==="Madhu"?"👩":"👨")+" "+escapeHTML(r.rewardReceiver):"Winner"}</div><div class="small">Who receives it</div></div></div><div class="small" style="margin-top:12px">${w?`Won ${formatDate(w.date)}`:`Saved ${formatDate(r.assignedDate||todayKey())}`}${r.givenDate?` · Given ${formatDate(r.givenDate)}`:""}</div>${can?`<button class="btn primary" style="margin-top:12px" type="button" onclick="cdMarkRewardGiven(${id})">✓ MARK REWARD AS GIVEN</button>`:""}</article>`}).join("")}</div>`)}
cdEnsureState();cdEvaluateChallenges();saveState();render();
</script>
